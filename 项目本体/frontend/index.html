<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PiAgent 赋能的高校排课系统 · 原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --pri:#3E6B9E; --pri-deep:#2C527C; --acc:#E8952F; --bg:#EEF2F7;
          --line:#D5DEE9; --text:#22334A; --ok:#2E7D32; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Microsoft YaHei","SimHei",sans-serif; background:var(--bg);
         color:var(--text); font-size:15px; }
  header { background:var(--pri-deep); color:#fff; padding:14px 28px;
           display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:19px; font-weight:bold; }
  header .who { font-size:14px; }
  header .who button { margin-left:14px; background:rgba(255,255,255,.15); font-size:13px; }
  .shell { display:flex; min-height:calc(100vh - 65px); }
  aside { width:170px; background:var(--pri-deep); color:#fff; padding:12px 0;
          flex-shrink:0; transition:width .18s ease; overflow:hidden; }
  aside.collapsed { width:62px; }
  aside .fold-btn { width:100%; background:none; color:#fff; border:none;
                    padding:6px 16px 14px; font-size:16px; text-align:right;
                    cursor:pointer; opacity:.7; }
  aside .fold-btn:hover { opacity:1; }
  aside .nav-item { padding:15px 14px 15px 16px; cursor:pointer; white-space:nowrap;
                    border-left:4px solid transparent; display:flex;
                    align-items:center; justify-content:space-between; }
  aside .nav-item .arr { opacity:.55; font-size:14px; }
  aside .nav-item.on .arr, aside .nav-item:hover .arr { opacity:1; }
  aside.collapsed .nav-item { padding:15px 0; display:flex;
                    justify-content:center; align-items:center; }
  aside.collapsed .nav-item .arr { display:none; }
                    border-left:4px solid transparent; }
  aside .nav-item:hover { background:rgba(255,255,255,.08); }
  aside .nav-item.on { background:rgba(255,255,255,.16); border-left-color:var(--acc); }
  aside .nav-item .nm { font-size:16px; font-weight:bold; }
  .content { flex:1; padding:26px 40px; }
  .card { background:#fff; border-radius:10px; padding:24px 28px; margin-bottom:20px;
          box-shadow:0 2px 10px rgba(40,70,110,.08); }
  .card h3 { font-size:17px; margin-bottom:16px; color:var(--pri-deep);
             padding-left:10px; border-left:4px solid var(--acc); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { border:1px solid var(--line); padding:10px 12px; text-align:center; }
  th { background:#EDF1F7; color:var(--pri-deep); }
  .tbl-scroll { max-height:460px; overflow-y:auto; }
  .tbl-scroll th { position:sticky; top:0; box-shadow:inset 0 -1px var(--line); }
  .tbl-fill { height:calc(100vh - 391px); min-height:200px; max-height:none; }
  .two-col { display:grid; grid-template-columns:330px 1fr; gap:20px; align-items:stretch;
             height:calc(100vh - 117px); min-height:0; overflow:hidden; }
  .two-col .left { display:flex; flex-direction:column; gap:20px; min-height:0; overflow:hidden; }
  .two-col .left .card.grow { flex:1; min-height:0; overflow:hidden; }
  .two-col .card { margin-bottom:0; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .two-col .card h3 { flex:none; }
  .two-col .left .row { flex-direction:column; align-items:stretch; }
  .two-col .left .row select, .two-col .left .row button { width:100%; }
  .export-links { margin-left:auto; display:flex; gap:14px; white-space:nowrap; }
  .two-col .tbl-scroll { flex:1; max-height:none; min-height:0; overflow-y:auto; }
  .stat-line { display:flex; align-items:baseline; gap:10px; padding:13px 18px;
               background:#EDF1F7; border-radius:8px; margin-bottom:10px; }
  .stat-line b { font-size:24px; color:var(--pri-deep); }
  .stat-line span { font-size:13px; color:#5A6B82; }
  .stat-wrap { flex:1; min-height:0; overflow-y:auto; }
  td.lft { text-align:left; }
  button { background:var(--pri); color:#fff; border:none; border-radius:6px;
           padding:9px 20px; cursor:pointer; font-size:15px; }
  button:hover { filter:brightness(1.1); }
  button.big { font-size:17px; padding:15px 46px; font-weight:bold; }
  button.warn { background:var(--acc); }
  button.ghost { background:#fff; color:var(--pri); border:1.5px solid var(--pri); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input,select { padding:10px 12px; border:1px solid #C3CFDD; border-radius:6px;
                 font-size:15px; }
  label.fld-label { font-size:14px; color:var(--pri-deep); font-weight:bold;
                    display:block; margin:14px 0 6px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .msg { padding:12px 16px; border-radius:6px; margin-bottom:10px; font-size:15px; }
  .msg.ok { background:#E6F2E6; color:var(--ok); }
  .msg.err { background:#FDECEA; color:#C62828; }
  .msg.info { background:#EDF1F7; color:var(--pri-deep); }
  .stat-grid { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .stat-grid div { background:#EDF1F7; border-radius:10px; padding:18px 26px;
                   text-align:center; min-width:120px; }
  .stat-grid b { font-size:30px; color:var(--pri-deep); display:block; }
  .stat-grid span { font-size:13px; color:#5A6B82; }
  .timetable td { height:40px; }
  .timetable small { color:#5A6B82; }
  .chat { max-height:380px; overflow-y:auto; border:1px solid var(--line);
          padding:14px; margin-bottom:10px; border-radius:6px; }
  .chat .b { margin-bottom:10px; font-size:15px; line-height:1.7; }
  .chat .b.me { text-align:right; color:var(--pri-deep); }
  /* ---- 登录封面 ---- */
  .cover { position:fixed; inset:0; display:grid; overflow:auto;
           grid-template-columns:1.25fr 1fr; grid-template-rows:100%;
           background:linear-gradient(90deg, rgba(244,248,252,.42) 0%, rgba(244,248,252,.22) 40%, rgba(244,248,252,0) 60%),
           url("/static/cover_bot.png") 22% center / cover no-repeat, linear-gradient(135deg,#DCEBFA 0%,#BBDCF7 45%,#9CC9F0 100%); }
  .cover-left { display:flex; flex-direction:column; justify-content:center;
           align-items:flex-start; padding:0 2vw 9vh 5vw; }
  .cover-brand { display:flex; align-items:center; gap:14px; }
  .cover-logo { width:64px; height:64px; border-radius:16px; background:#fff;
                display:flex; align-items:center; justify-content:center;
                box-shadow:0 6px 18px rgba(30,90,160,.25); }
  .cover-logo svg { width:40px; height:40px; }
  .cover-title { font-size:34px; white-space:nowrap; text-shadow:0 1px 6px rgba(255,255,255,.85), 0 0 14px rgba(255,255,255,.6); font-weight:bold; color:#16324F; letter-spacing:2px;
                 font-family:"Microsoft YaHei","SimHei",sans-serif; }
  .cover-title-en { font-size:15px; text-shadow:0 1px 4px rgba(255,255,255,.95), 0 0 10px rgba(255,255,255,.75); color:#4A6FA5; letter-spacing:1px; margin-top:4px; }
  .cover-right { position:absolute; right:4vw; top:50%; transform:translateY(-50%); }
  .glass { width:440px; height:440px; background:rgba(255,255,255,.72);
           backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
           border:1px solid rgba(255,255,255,.8); border-radius:18px;
           padding:46px 44px; box-shadow:0 12px 40px rgba(30,90,160,.28);
           display:flex; flex-direction:column; }
  .glass h3 { font-size:22px; color:#16324F; border-bottom:3px solid var(--pri);
              display:inline-block; padding-bottom:6px; }
  .glass .fld { margin-top:30px; position:relative; }
  .glass input { width:100%; padding:13px 14px 13px 42px; border:1px solid #C9D8EA;
                 border-radius:10px; font-size:14px; background:rgba(255,255,255,.85); }
  .glass input:focus { outline:2px solid var(--pri); border-color:var(--pri); }
  .glass .fld .pi { position:absolute; left:12px; top:50%; transform:translateY(-50%);
                    width:18px; height:18px; opacity:.55; }
  .glass > button { width:100%; margin-top:36px; padding:14px; font-size:17px;
                  border-radius:10px; background:var(--pri); }
  .glass button:hover { filter:brightness(1.08); }
  .glass .demo-row { display:flex; gap:12px; margin-top:auto; }
  .glass .demo-btn { flex:1; background:#EDF1F7; color:var(--pri); border:1px solid #C9D8EA;
                     font-size:13px; padding:11px 6px; border-radius:8px; }
  .glass .demo-btn:hover { background:var(--pri); color:#fff; }
  .glass .msg { margin-top:16px; }
  /* ---- PiAgent 悬浮球与悬浮窗（仅管理员可见；机器人形象） ---- */
  .agent-fab { position:fixed; width:64px; height:64px;
               border-radius:50%; background:var(--pri); border:3px solid #fff;
               cursor:grab; box-shadow:0 6px 22px rgba(30,90,160,.4); z-index:60;
               display:flex; align-items:center; justify-content:center;
               touch-action:none; user-select:none; }
  .agent-fab:hover { filter:brightness(1.12); }
  .agent-fab svg { width:44px; height:44px; }
  .agent-win { position:fixed; width:380px; height:500px;
               background:#fff; border-radius:14px; border:1px solid var(--line);
               box-shadow:0 14px 44px rgba(30,90,160,.3); z-index:60;
               display:flex; flex-direction:column; overflow:hidden; }
  .agent-win .aw-head { background:var(--pri-deep); color:#fff; padding:12px 16px;
                        display:flex; justify-content:space-between; align-items:center;
                        cursor:move; touch-action:none; user-select:none; }
  .agent-win .aw-head .t { font-size:15px; font-weight:bold; }
  .agent-win .aw-head button { background:none; font-size:16px; padding:0 4px; }
  .agent-win .chat { flex:1; margin:0; border:none; border-radius:0; }
  .agent-win .send { display:flex; gap:8px; padding:10px;
                     border-top:1px solid var(--line); }
  .agent-win .send input { flex:1; }
  @media (max-width:860px) { .cover { grid-template-columns:1fr; grid-template-rows:auto auto; }
    .cover-left { padding:6vh 8vw 2vh; }
    .cover-title { font-size:30px; white-space:normal; }
    .cover-right { padding:2vh 8vw 8vh; } }
</style>
</head>
<body>
<div id="app">
  <!-- 登录封面 -->
  <div v-if="!token" class="cover">
    <div class="cover-left">
      <div class="cover-brand">
        <div class="cover-logo">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="3" fill="#4E79A7"/><rect x="3" y="4" width="18" height="5" rx="2.5" fill="#16324F"/><rect x="6.5" y="12" width="4" height="3" rx="0.8" fill="#fff"/><rect x="13.5" y="12" width="4" height="3" rx="0.8" fill="#F28E2B"/><rect x="6.5" y="16.5" width="4" height="3" rx="0.8" fill="#F28E2B"/><rect x="13.5" y="16.5" width="4" height="3" rx="0.8" fill="#fff"/><path d="M8 2v4M16 2v4" stroke="#16324F" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div>
          <div class="cover-title">PiAgent 赋能的高校排课系统</div>
          <div class="cover-title-en">PiAgent-Empowered University Course Scheduling System</div>
        </div>
      </div>
    </div>
    <div class="cover-right">
      <div class="glass">
        <h3>登录系统</h3>
        <div class="fld">
          <svg class="pi" viewBox="0 0 24 24" fill="#16324F"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-5 0-9 2.5-9 5v3h18v-3c0-2.5-4-5-9-5z"/></svg>
          <input v-model="loginName" placeholder="请输入用户名" @keyup.enter="doLogin">
        </div>
        <div class="fld">
          <svg class="pi" viewBox="0 0 24 24" fill="#16324F"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2zm-8-2a3 3 0 0 1 6 0v2H9V7zm3 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
          <input type="password" v-model="password" placeholder="请输入密码" @keyup.enter="doLogin">
        </div>
        <button @click="doLogin">登 录</button>
        <div class="msg err" v-if="msg">{{ msg }}</div>
        <div class="demo-row">
          <button class="demo-btn" @click="quickLogin('admin','admin123')">管理员</button>
          <button class="demo-btn" @click="quickLogin('t01','t01123')">教师</button>
          <button class="demo-btn" @click="quickLogin('s0001','s123456')">学生</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 主界面：左侧功能导航 + 内容区 -->
  <template v-if="token">
    <header>
      <h1>PiAgent 赋能的高校排课系统 · 原型</h1>
      <div class="who">{{ loginName }}（{{ roleCN }}）
        <button @click="doLogout">退出</button></div>
    </header>
    <div class="shell">
      <aside :class="{collapsed: collapsed}">
        <button class="fold-btn" @click="collapsed = !collapsed">{{ collapsed ? '»' : '«' }}</button>
        <div v-for="n in currentNav" :key="n.k" class="nav-item" :class="{on: tab===n.k}" @click="tab=n.k">
          <span class="no" v-if="collapsed">{{ n.no }}</span>
          <span class="nm" v-else>{{ n.no }} {{ n.nm }}</span>
        </div>
      </aside>
      <main class="content">
        <div class="msg" :class="flashType" v-if="flash">{{ flash }}</div>

        <!-- ===== 管理员 · 导入数据 ===== -->
        <div v-if="role==='admin' && tab==='import'">
          <div class="card">
            <h3>上传教学计划文件</h3>
            <div class="row">
              <input type="file" @change="pickFile">
              <select v-model="importTerm"><option>2026-2027-1</option><option>2026-2027-2</option></select>
              <button class="big" @click="doImport" :disabled="!file">导入</button>
            </div>
            <div class="msg err" v-if="importErrors.length">
              <div v-for="e in importErrors">{{ e }}</div>
            </div>
          </div>
          <div class="card">
            <h3>已导入的开课任务（{{ tasks.length }} 条）</h3>
            <div class="tbl-scroll tbl-fill">
              <table>
                <tr><th>课程</th><th>教师</th><th>班级</th><th>周次</th></tr>
                <tr v-for="t in tasks"><td>{{ t.course }}</td><td>{{ t.teacher }}</td><td>{{ t["class"] }}</td><td>{{ t.weeks }}</td></tr>
              </table>
            </div>
          </div>
        </div>

        <!-- ===== 管理员 · 配置约束 ===== -->
        <div v-if="role==='admin' && tab==='constraint'" class="two-col">
          <div class="left">
            <div class="card">
              <h3>添加约束</h3>
              <div class="row col">
                <select v-model="newC.key">
                  <option value="prefer_day">期望某天上课（软）</option>
                  <option value="avoid_day">回避某天上课（软）</option>
                  <option value="max_daily">每日节次上限（软）</option>
                </select>
                <select v-model="newC.day"><option>周一</option><option>周二</option><option>周三</option><option>周四</option><option>周五</option></select>
                <button @click="addConstraint">保存约束</button>
              </div>
            </div>
            <div class="card grow">
              <h3>约束概览</h3>
              <div class="stat-wrap">
                <div class="stat-line"><b>{{ consStats.consOn }}<small style="font-size:14px;color:#5A6B82"> / {{ consStats.consTotal }}</small></b><span>软约束启用</span></div>
                <div class="stat-line"><b>{{ consStats.prefOn }}<small style="font-size:14px;color:#5A6B82"> / {{ consStats.prefTotal }}</small></b><span>教师偏好启用</span></div>
                <div class="stat-line"><b :style="{color: consStats.pending ? 'var(--acc)' : 'var(--ok)'}">{{ consStats.pending }}</b><span>待确认项</span></div>
              </div>
            </div>
          </div>
          <div class="card">
            <h3>约束清单（{{ allRows.length }} 条）</h3>
            <div class="tbl-scroll">
              <table>
                <tr><th>类型</th><th>来源</th><th>内容</th><th>状态</th><th>操作</th></tr>
                <tr v-for="(r,i) in allRows" :key="i">
                  <td>{{ r.kind }}</td>
                  <td>{{ r.src }}</td>
                  <td class="lft">{{ r.content }}</td>
                  <td>{{ r.status }}</td>
                  <td>
                    <button v-if="r.act==='confirm'" class="warn" @click="rowAction(r)">确认生效</button>
                    <button v-else-if="r.act==='启用'" @click="rowAction(r)">启用</button>
                    <button v-else-if="r.act==='停用'" class="warn" @click="rowAction(r)">停用</button>
                    <span v-else>—</span>
                  </td>
                </tr>
              </table>
            </div>
          </div>
        </div>

        <!-- ===== 管理员 · 自动排课 ===== -->
        <div v-if="role==='admin' && tab==='engine'" class="two-col">
          <div class="left">
            <div class="card">
              <h3>本学期数据</h3>
              <div class="stat-wrap">
                <div class="stat-line"><b>{{ stats.tasks }}</b><span>开课任务</span></div>
                <div class="stat-line"><b>{{ stats.records }}</b><span>已排课表</span></div>
                <div class="stat-line"><b :style="{color: stats.conflicts === 0 ? 'var(--ok)' : 'var(--acc)'}">{{ stats.conflicts }}</b><span>硬冲突</span></div>
              </div>
            </div>
            <div class="card grow" style="justify-content:center;">
              <button class="big" @click="solve" :disabled="solving">
                {{ solving ? '正在自动排课，请稍候…' : '开始自动排课' }}</button>
              <div class="msg ok" v-if="solveReport" style="margin-top:16px; font-size:15px">{{ solveReport }}</div>
            </div>
          </div>
          <div class="card">
            <h3>课表预览与导出</h3>
            <div class="row" style="margin-bottom:12px; flex-wrap:nowrap;">
              <select v-model="ttQuery.view" @change="resetRef">
                <option value="class">按班级</option><option value="teacher">按教师</option><option value="room">按教室</option>
              </select>
              <select v-model="ttQuery.ref" @change="loadTT('admin')" style="flex:1">
                <option v-if="ttQuery.view==='class'" v-for="c in classes" :value="c.id">{{ c.name }}</option>
                <option v-if="ttQuery.view==='teacher'" v-for="t in teachers" :value="t.id">{{ t.name }}</option>
                <option v-if="ttQuery.view==='room'" v-for="r in rooms" :value="r.id">{{ r.rno }}</option>
              </select>
              <span class="export-links"><a :href="exportUrl('csv')">导出 CSV</a><a :href="exportUrl('xlsx')">导出 Excel</a></span>
            </div>
            <div class="tbl-scroll">
              <table class="timetable">
                <tr><th>节次</th><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th></tr>
                <tr v-for="p in 4"><td>第 {{ p }} 节</td>
                  <template v-for="c in rowCells(p)">
                    <td v-if="!c.skip" :rowspan="c.span">
                      <div v-for="r in c.recs" :key="r.record_id">
                        {{ r.course }}<br><small>{{ r.teacher }} @{{ r.room }}</small>
                      </div>
                    </td>
                  </template>
                </tr>
              </table>
            </div>
          </div>
        </div>

        <!-- ===== 管理员 · 调课审核 ===== -->
        <div v-if="role==='admin' && tab==='adjust'">
          <div class="card">
            <h3>调课申请列表</h3>
            <div class="tbl-scroll">
              <table><tr><th>申请</th><th>原安排</th><th>期望</th><th>原因</th><th>状态</th><th>操作</th></tr>
                <tr v-for="r in adjusts"><td>#{{ r.id }}</td><td>{{ r.original }}</td><td>{{ r.expectation }}</td><td>{{ r.reason }}</td>
                  <td>{{ r.status }}<div v-if="r.review_comment" style="font-size:12px;color:#666">{{ r.review_comment }}</div></td>
                  <td v-if="r.status==='待审核'"><button @click="review(r,'通过')">通过</button> <button class="warn" @click="review(r,'退回')">退回</button></td>
                  <td v-else>—</td></tr>
                <tr v-if="!adjusts.length"><td colspan="6">暂无调课申请</td></tr>
              </table>
            </div>
          </div>
        </div>

        <!-- ===== 管理员 · 系统日志 ===== -->
        <div v-if="role==='admin' && tab==='audit'">
          <div class="card">
            <h3>操作留痕（最近 100 条）</h3>
            <div class="tbl-scroll">
              <table><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th><th>详情</th></tr>
                <tr v-for="a in audits"><td>{{ a.created_at }}</td><td>{{ a.operator }}</td><td>{{ a.action }}</td><td>{{ a.target }}</td><td>{{ a.detail }}</td></tr>
              </table>
            </div>
          </div>
        </div>

        <!-- ===== 教师 · 我的课表 ===== -->
        <div v-if="role==='teacher' && tab==='tt'">
          <div class="card">
            <h3>我的课表</h3>
            <div class="row">
              <button @click="loadTT('teacher')">刷新</button>
              <a :href="exportUrl('csv')">导出 CSV</a>
            </div>
            <table class="timetable">
              <tr><th>节次</th><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th></tr>
              <tr v-for="p in 4"><td>第 {{ p }} 节</td>
                <template v-for="c in rowCells(p)">
                  <td v-if="!c.skip" :rowspan="c.span">
                    <div v-for="r in c.recs" :key="r.record_id">
                      {{ r.course }}<br><small>{{ r.room }}</small>
                    </div>
                  </td>
                </template>
              </tr>
            </table>
          </div>
        </div>

        <!-- ===== 教师 · 调课申请 ===== -->
        <div v-if="role==='teacher' && tab==='apply'">
          <div class="card">
            <h3>发起新申请</h3>
            <div class="row">
              <select style="flex:1" v-model="applyRecord"><option value="">选择我的课表记录</option>
                <option v-for="r in ttRows" :value="r.record_id">周{{ r.day }} 第{{ r.period }}节 {{ r.course }} @{{ r.room }}</option>
              </select>
            </div>
            <div class="row"><input style="flex:1" v-model="applyExpect" placeholder="期望安排（如：周三 第2节）"></div>
            <div class="row"><input style="flex:1" v-model="applyReason" placeholder="原因（如：外出开会）"></div>
            <button class="big" @click="doApply">提交申请</button>
          </div>
          <div class="card">
            <h3>我的申请记录</h3>
            <table><tr><th>编号</th><th>原安排</th><th>期望</th><th>状态</th><th>审核意见</th></tr>
              <tr v-for="r in adjusts"><td>#{{ r.id }}</td><td>{{ r.original }}</td><td>{{ r.expectation }}</td><td>{{ r.status }}</td><td>{{ r.review_comment }}</td></tr>
            </table>
          </div>
        </div>

        <!-- ===== 教师/学生 · 通知 ===== -->
        <div v-if="tab==='notify'" class="card">
          <h3>站内通知</h3>
          <div class="msg info" v-for="n in notifications">{{ n.created_at }} — {{ n.content }}</div>
          <p v-if="!notifications.length" style="color:#666;font-size:14px">暂无通知</p>
        </div>

        <!-- ===== 学生 · 我的课表 ===== -->
        <div v-if="role==='student' && tab==='tt'" class="card">
          <h3>我的课表</h3>
          <table class="timetable">
            <tr><th>节次</th><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th></tr>
            <tr v-for="p in 4"><td>第 {{ p }} 节</td>
              <template v-for="c in rowCells(p)">
                <td v-if="!c.skip" :rowspan="c.span">
                  <div v-for="r in c.recs" :key="r.record_id">
                    {{ r.course }}<br><small>{{ r.teacher }} @{{ r.room }}</small>
                  </div>
                </td>
              </template>
            </tr>
          </table>
        </div>
      </main>
    </div>

    <!-- PiAgent 悬浮球与悬浮窗（三角色可见，工具按角色差异化） -->
    <template v-if="role">
      <div class="agent-fab" v-if="!agentOpen" :style="{left: fabPos.x+'px', top: fabPos.y+'px'}"
        @pointerdown="dragFab" @click="fabClick" title="PiAgent 智能助手（可拖动）">
        <svg viewBox="0 0 64 64">
          <rect x="10" y="14" width="44" height="40" rx="14" fill="#fff"/>
          <rect x="18" y="24" width="28" height="18" rx="9" fill="#16324F"/>
          <circle cx="27" cy="33" r="3.5" fill="#7EC3F5"/>
          <circle cx="37" cy="33" r="3.5" fill="#7EC3F5"/>
          <rect x="26" y="40" width="12" height="3" rx="1.5" fill="#7EC3F5"/>
          <line x1="32" y1="14" x2="32" y2="8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="32" cy="7" r="3" fill="#F28E2B"/>
        </svg>
      </div>
      <div class="agent-win" v-else :style="{left: winPos.x+'px', top: winPos.y+'px'}">
        <div class="aw-head" @pointerdown="dragWin">
          <span class="t">PiAgent 智能助手·{{ agentRoleLabel }}（{{ agentMode==='stub' ? '桩模式' : '真实大模型' }}）</span>
          <button @pointerdown.stop @click="agentOpen = false">✕</button>
        </div>
        <div class="chat"><div v-for="(b,i) in chat" :key="i" class="b" :class="{me: b.me}">{{ b.t }}</div></div>
        <div class="send"><input style="flex:1" v-model="chatIn" @keyup.enter="sendChat"
          :placeholder="agentPlaceholder">
          <button @click="sendChat">发送</button></div>
      </div>
    </template>
  </template>
</div>

<script src="/static/vue.global.prod.js"></script>
<script>
const API = "";
function api(method, path, body) {
  return fetch(API + path, {
    method, headers: Object.assign({"Content-Type": "application/json"},
      V.token ? {"X-Auth-Token": V.token} : {}),
    body: body ? JSON.stringify(body) : undefined
  }).then(r => r.json());
}
const V = { token: "", loginName: "", role: "", refId: 0 };
Vue.createApp({
  data() {
    return {
      token: "", loginName: "", role: "", refId: 0,
      password: "", msg: "", flash: "", flashType: "ok",
      tab: "import",
      adminNav: [
        {k:"import", no:"1", nm:"导入数据"},
        {k:"constraint", no:"2", nm:"配置约束"},
        {k:"engine", no:"3", nm:"自动排课"},
        {k:"adjust", no:"4", nm:"调课审核"},
        {k:"agent", no:"AI", nm:"智能助手"},
        {k:"audit", no:"记", nm:"系统日志"}],
      teacherNav: [
        {k:"tt", nm:"我的课表"},
        {k:"apply", nm:"调课申请"},
        {k:"notify", nm:"通知"}],
      studentNav: [
        {k:"tt", nm:"我的课表"},
        {k:"notify", nm:"通知"}],
      stats: {}, solving: false, solveReport: "",
      file: null, importTerm: "2026-2027-1", importErrors: [],
      audits: [], constraints: [], preferences: [], pendings: [], adjusts: [],
      teachers: [], classes: [], rooms: [], courses: [], tasks: [],
      newC: {key:"avoid_day", day:"周五"},
      ttView: "", ttRows: [], ttQuery: {view:"class", ref:""},
      applyRecord: "", applyExpect: "", applyReason: "",
      notifications: [], chat: [], chatIn: "", agentMode: "stub",
      collapsed: false, agentOpen: false,
      fabPos: {x: 0, y: 0}, winPos: {x: 0, y: 0}, dragDist: 0,
    };
  },
  computed: {
    roleCN() { return {admin:"教务管理员", teacher:"任课教师", student:"学生"}[this.role] || ""; },
    currentNav() {
      return {admin: this.adminNav, teacher: this.teacherNav,
              student: this.studentNav}[this.role] || [];
    },
    agentRoleLabel() {   // 三角色智能体能力差异一目了然
      return {admin: "管理员·约束与偏好编排", teacher: "教师·偏好提交与课表查询",
              student: "学生·课表问答"}[this.role] || "";
    },
    agentPlaceholder() {
      return {admin: "试试：T003 希望尽量安排在周二上午 或 全局避开周五下午",
              teacher: "试试：我周二上午有会，尽量别排我的课",
              student: "试试：查课表"}[this.role] || "";
    },
    allRows() {   // 统一约束清单：PiAgent 待确认项 + 教师偏好 + 管理员软约束
      const tmap = {};
      this.teachers.forEach(t => { tmap[t.id] = t; });
      const keyCN = {prefer_day: "期望某天上课", avoid_day: "回避某天上课", max_daily: "每日节次上限"};
      const ptypeCN = {prefer: "期望", avoid: "回避", consecutive: "连堂"};
      const rows = [];
      this.pendings.forEach(p => rows.push({
        kind: p.kind === "preference" ? "教师偏好" : "软约束",
        src: "PiAgent",
        content: (p.payload && p.payload.desc) || "",
        status: "待确认", act: "confirm", pid: p.id}));
      this.preferences.forEach(p => {
        const t = tmap[p.teacher_id];
        rows.push({
          kind: "教师偏好",
          src: t ? t.name + "（" + t.tno + "）" : "教师#" + p.teacher_id,
          content: (ptypeCN[p.ptype] || p.ptype) + "：" + p.content,
          status: p.status,
          act: p.status === "草稿" ? "启用" : (p.status === "已启用" ? "停用" : ""),
          pref: p.id});
      });
      this.constraints.forEach(c => {
        let param = "";
        try {
          const q = typeof c.params === "string" ? JSON.parse(c.params) : c.params;
          param = q.day || q.n || "";
        } catch (e) { param = String(c.params); }
        rows.push({
          kind: "软约束", src: "管理员",
          content: (keyCN[c.key] || c.key) + (param ? "：" + param : ""),
          status: c.enabled ? "启用" : "停用",
          act: c.enabled ? "停用" : "启用", cons: c.id});
      });
      return rows;
    },
    consStats() {
      return {
        consTotal: this.constraints.length,
        consOn: this.constraints.filter(c => c.enabled).length,
        prefTotal: this.preferences.length,
        prefOn: this.preferences.filter(p => p.status === "已启用").length,
        pending: Array.isArray(this.pendings) ? this.pendings.length : 0,
      };
    },
    ttSegs() {   // 课表连排段：同任务同天相邻节次合并为 {day, start, span, recs}
      const byTask = {};
      this.ttRows.forEach(r => { (byTask[r.task_id] = byTask[r.task_id] || []).push(r); });
      const segs = [];
      Object.values(byTask).forEach(list => {
        list.sort((a, b) => a.day - b.day || a.period - b.period);
        let cur = null;
        list.forEach(r => {
          if (cur && cur.day === r.day && cur.start + cur.span === r.period) {
            cur.span++; cur.recs.push(r);
          } else {
            cur = {day: r.day, start: r.period, span: 1, recs: [r]};
            segs.push(cur);
          }
        });
      });
      return segs;
    },
  },
  watch: {
    tab(v) {   // 切回约束页时拉最新数据（agent 生成待确认项后立即可见）
      if (this.role === "admin" && v === "constraint") this.refreshConstraintLists();
      if (this.role === "admin" && v === "engine") {   // 进入排课页：刷新统计并默认渲染一个班级课表
        this.loadHome();
        if (!this.ttQuery.ref && this.classes.length) this.ttQuery.ref = this.classes[0].id;
        this.loadTT("admin");
      }
    },
  },
  methods: {
    quickLogin(name, pwd) {
      this.loginName = name; this.password = pwd;   // 只填账号密码，登录仍点「登 录」
    },
    async doLogin() {
      const d = await api("POST", "/api/auth/login",
        {login_name: this.loginName, password: this.password});
      if (d.code !== 0) { this.msg = d.message; return; }
      this.token = d.data.token; this.loginName = d.data.login_name;
      this.role = d.data.role; this.refId = d.data.ref_id;
      V.token = this.token;
      this.boot();
    },
    async doLogout() { await api("POST", "/api/auth/logout"); location.reload(); },
    flashMsg(t, type) { this.flash = t; this.flashType = type || "ok";
      setTimeout(() => { this.flash = ""; }, 6000); },
    async boot() {
      if (this.role === "admin") { this.tab = "import"; await this.loadHome(); }
      else { this.tab = "tt"; await this.loadTT(this.role); }
      if (this.role === "teacher") { await this.loadAdjusts(); }
      await this.loadNotify();
    },
    async loadHome() {
      const b = await api("GET", "/api/base/teachers"); this.teachers = b.data || [];
      const c = await api("GET", "/api/base/classes"); this.classes = c.data || [];
      const r = await api("GET", "/api/base/rooms"); this.rooms = r.data || [];
      const co = await api("GET", "/api/base/courses"); this.courses = co.data || [];
      const tk = await api("GET", "/api/base/tasks"); this.tasks = tk.data || [];
      const d = await api("GET", "/api/engine/report"); const rep = d.data || {};
      const a = await api("GET", "/api/audit/list"); this.audits = a.data || [];
      const cs = await api("GET", "/api/constraint/list");
      this.constraints = cs.data.constraints; this.preferences = cs.data.preferences;
      const pd = await api("GET", "/api/agent/pending"); this.pendings = pd.data || [];
      this.stats = {teachers: this.teachers.length, courses: this.courses.length,
        classes: this.classes.length, tasks: this.tasks.length,
        records: rep.records || 0, conflicts: rep.hard_conflicts == null ? "—" : rep.hard_conflicts};
    },
    async solve() {
      this.solving = true; this.solveReport = "";
      const d = await api("POST", "/api/engine/solve");
      this.solving = false;
      if (d.code !== 0) { this.flashMsg(d.message, "err"); return; }
      this.solveReport = "排课完成：任务 " + d.data.tasks + " 条，耗时 " + d.data.elapsed_seconds +
        " 秒，硬冲突 " + d.data.hard_conflicts + "，" + d.data.optimizer.reason +
        "（迭代 " + d.data.optimizer.iterations + "）";
      await this.loadTT("admin"); await this.loadHome();
    },
    pickFile(e) { this.file = e.target.files[0]; },
    async doImport() {
      if (!this.file) return;
      const fd = new FormData(); fd.append("file", this.file); fd.append("term", this.importTerm);
      const r = await fetch("/api/base/import-plan", {method:"POST",
        headers: {"X-Auth-Token": this.token}, body: fd});
      const d = await r.json();
      if (d.code !== 0) { this.importErrors = (d.data && d.data.errors) || [d.message]; return; }
      this.importErrors = [];
      this.flashMsg("导入成功 " + d.data.success + " 行");
      await this.loadHome();
    },
    async addConstraint() {
      const d = await api("POST", "/api/constraint/add", {key: this.newC.key,
        params: {day: this.newC.day, period: this.newC.period || null}, priority: 3});
      this.flashMsg(d.code === 0 ? "约束已新增" : d.message, d.code === 0 ? "ok" : "err");
      await this.refreshConstraintLists();
    },
    async refreshConstraintLists() {
      const cs = await api("GET", "/api/constraint/list");
      this.constraints = cs.data.constraints || []; this.preferences = cs.data.preferences || [];
      const pd = await api("GET", "/api/agent/pending");
      this.pendings = Array.isArray(pd.data) ? pd.data : [];
    },
    resetRef() {   // 切换视图（班级/教师/教室）时把对象重置为该视图第一项并立即查询
      const list = this.ttQuery.view === "class" ? this.classes
                 : this.ttQuery.view === "teacher" ? this.teachers : this.rooms;
      this.ttQuery.ref = list.length ? list[0].id : "";
      this.loadTT("admin");
    },
    async rowAction(r) {
      if (r.act === "confirm") {
        const d = await api("POST", "/api/agent/confirm", {id: r.pid});
        this.flashMsg(d.code === 0 ? d.data.result : d.message, d.code === 0 ? "ok" : "err");
      } else if (r.kind === "教师偏好") {
        await api("POST", "/api/constraint/preference-status",
                  {id: r.pref, status: r.act === "启用" ? "已启用" : "已停用"});
      } else {
        await api("POST", "/api/constraint/status", {id: r.cons, enabled: r.act === "启用"});
      }
      await this.refreshConstraintLists();
    },
    async loadAdjusts() {
      const d = await api("GET", "/api/adjust/list"); this.adjusts = d.data || [];
    },
    async review(r, verdict) {
      const d = await api("POST", "/api/adjust/review", {id: r.id, verdict, comment: r._c || ""});
      this.flashMsg(d.code === 0 ? ("申请 #" + r.id + "：" + d.data.note) : d.message,
                    d.code === 0 ? "ok" : "err");
      await this.loadAdjusts();
    },
    async loadTT(role) {
      let url;
      if (role === "admin") { this.ttView = "按" + this.ttQuery.view;
        url = "/api/query/schedule?view=" + this.ttQuery.view + "&ref=" + this.ttQuery.ref; }
      else if (role === "teacher") { this.ttView = "教师本人"; url = "/api/query/schedule?view=teacher"; }
      else { this.ttView = "学生本人"; url = "/api/query/schedule?view=student"; }
      const d = await api("GET", url);
      if (d.code !== 0) { this.flashMsg(d.message, "err"); return; }
      this.ttRows = d.data.rows;
    },
    rowCells(p) {   // 连排块渲染：段起点输出 rowspan 格，段内其余节跳过
      const out = [];
      for (let d = 1; d <= 5; d++) {
        const blk = this.ttSegs.find(s => s.day === d && s.start === p);
        const covered = this.ttSegs.some(s => s.day === d && p > s.start && p < s.start + s.span);
        out.push(covered ? {skip: true} : {day: d, span: blk ? blk.span : 1, recs: blk ? blk.recs : []});
      }
      return out;
    },
    exportUrl(fmt) {
      if (this.role === "teacher") return "/api/query/export?view=teacher&fmt=" + fmt;
      return "/api/query/export?view=" + this.ttQuery.view + "&ref=" + this.ttQuery.ref + "&fmt=" + fmt;
    },
    async doApply() {
      const d = await api("POST", "/api/adjust/apply", {record_id: this.applyRecord,
        expectation: this.applyExpect, reason: this.applyReason});
      this.flashMsg(d.code === 0 ? "申请已提交（#" + d.data.id + "）" : d.message,
                    d.code === 0 ? "ok" : "err");
      await this.loadAdjusts();
    },
    async loadNotify() {
      const d = await api("GET", "/api/query/notifications?login_name=" + this.loginName);
      this.notifications = d.data.items;
    },
    async sendChat() {
      const q = this.chatIn; if (!q) return;
      this.chat.push({me: true, t: q}); this.chatIn = "";
      const d = await api("POST", "/api/agent/chat", {instruction: q});
      this.agentMode = d.data.mode;
      this.chat.push({me: false, t: d.data.answer});
      if (d.data.pendings && d.data.pendings.length) {
        const tip = this.role === "admin"
          ? "★ 已生成待确认项，确认后才会生效（点击待确认项列表中的「确认生效」）。"
          : "★ 已提交教务管理员，管理员确认后生效，可在「通知」中留意结果。";
        this.chat.push({me: false, t: tip});
        if (this.role === "admin") await this.refreshConstraintLists();
      }
    },
    fabClick() {
      if (this.dragDist < 6) {
        // 聊天窗在悬浮球处展开（右缘对齐球右缘），并整体收进视口
        this.winPos.x = Math.max(8, Math.min(innerWidth - 388, this.fabPos.x + 64 - 380));
        this.winPos.y = Math.max(8, Math.min(innerHeight - 508, this.fabPos.y));
        this.agentOpen = true;
      }
      this.dragDist = 0;
    },
    dragFab(e) {
      const sx = e.clientX, sy = e.clientY, ox = this.fabPos.x, oy = this.fabPos.y;
      const move = ev => {
        this.dragDist = Math.max(this.dragDist,
          Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy));
        this.fabPos.x = Math.max(0, Math.min(innerWidth - 64, ox + ev.clientX - sx));
        this.fabPos.y = Math.max(0, Math.min(innerHeight - 64, oy + ev.clientY - sy));
      };
      const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
      addEventListener("pointermove", move); addEventListener("pointerup", up);
    },
    dragWin(e) {
      if (e.target.closest("button")) return;   // 点 ✕ 不触发拖拽
      const sx = e.clientX, sy = e.clientY, ox = this.winPos.x, oy = this.winPos.y;
      const move = ev => {
        this.winPos.x = Math.max(0, Math.min(innerWidth - 380, ox + ev.clientX - sx));
        this.winPos.y = Math.max(0, Math.min(innerHeight - 500, oy + ev.clientY - sy));
      };
      const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
      addEventListener("pointermove", move); addEventListener("pointerup", up);
    },
  },
  mounted() {   // 默认右上角（顶栏下方，右缘 26px）
    this.fabPos = {x: innerWidth - 90, y: 78};
    this.winPos = {x: innerWidth - 406, y: 78};
  },
}).mount("#app");
</script>
</body>
</html>
